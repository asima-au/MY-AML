<!doctype html>
<html lang="en-AU" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AML TurboTax for Tranche 2</title>
  <meta name="description" content="AUSTRAC Tranche 2 AML/CTF readiness assessment, gap analysis and data pack." />
  <!-- Worker API base URL, e.g. https://aml-tranche2-assessor.<account>.workers.dev. Empty = same origin (localhost uses :8787). -->
  <meta name="aml-api-base" content="" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    const token = (name) => `rgb(var(--${name}) / <alpha-value>)`;
    tailwind.config = {
      theme: {
        extend: {
          colors: Object.fromEntries(
            ["bg", "surface", "surface-2", "ink", "muted", "line", "brand", "brand-soft", "on-brand", "crit", "crit-soft", "high", "high-soft", "med", "med-soft", "ok", "ok-soft"].map((n) => [n, token(n)]),
          ),
          fontFamily: {
            display: ['"Bricolage Grotesque"', "ui-sans-serif", "system-ui", "sans-serif"],
            sans: ["Geist", "ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "sans-serif"],
            mono: ['"Geist Mono"', "ui-monospace", "SFMono-Regular", "Menlo", "monospace"],
          },
        },
      },
    };
  </script>
  <style>
    /* Layout: sticky top bar with progress; start = intro + business card; questions = section rail (lg) + one focused question; results = stacked report. */
    :root {
      --bg: 243 246 245; --surface: 255 255 255; --surface-2: 234 239 237; --ink: 15 27 25; --muted: 78 95 91; --line: 213 222 219;
      --brand: 12 92 86; --brand-soft: 219 239 235; --on-brand: 255 255 255;
      --crit: 185 28 28; --crit-soft: 254 226 226; --high: 194 65 12; --high-soft: 255 237 213;
      --med: 146 89 6; --med-soft: 254 243 199; --ok: 21 128 61; --ok-soft: 220 252 231;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: 10 17 16; --surface: 17 27 26; --surface-2: 25 38 36; --ink: 229 238 235; --muted: 150 169 164; --line: 41 58 55;
        --brand: 94 206 190; --brand-soft: 18 52 49; --on-brand: 5 28 26;
        --crit: 252 129 129; --crit-soft: 72 22 22; --high: 251 154 84; --high-soft: 70 33 10; --med: 250 204 21; --med-soft: 60 46 8; --ok: 74 222 128; --ok-soft: 14 52 31;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: 10 17 16; --surface: 17 27 26; --surface-2: 25 38 36; --ink: 229 238 235; --muted: 150 169 164; --line: 41 58 55;
      --brand: 94 206 190; --brand-soft: 18 52 49; --on-brand: 5 28 26;
      --crit: 252 129 129; --crit-soft: 72 22 22; --high: 251 154 84; --high-soft: 70 33 10; --med: 250 204 21; --med-soft: 60 46 8; --ok: 74 222 128; --ok-soft: 14 52 31;
      color-scheme: dark;
    }
    body { background: rgb(var(--bg)); color: rgb(var(--ink)); font-family: Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: rgb(var(--bg)); }
    [hidden] { display: none !important; }
    h1, h2, h3 { text-wrap: balance; }
    .sticky-top { top: env(safe-area-inset-top, 0px); }
    .tabular { font-variant-numeric: tabular-nums; }
    .view-enter { animation: rise .32s cubic-bezier(.2, .7, .2, 1); }
    @keyframes rise { from { opacity: .4; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .gauge-arc { transition: stroke-dasharray 1s cubic-bezier(.2, .7, .2, 1); }
    .no-scrollbar { scrollbar-width: none; } .no-scrollbar::-webkit-scrollbar { display: none; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body class="min-h-full antialiased">
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-lg focus:bg-surface focus:px-4 focus:py-2 focus:shadow-lg">Skip to content</a>

  <header class="sticky-top sticky z-30 border-b border-line/70 bg-bg/85 backdrop-blur-md">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3 sm:px-6 lg:px-8">
      <button type="button" id="home-btn" class="group flex items-center gap-3 rounded-lg text-left focus:outline-none focus-visible:ring-2 focus-visible:ring-brand">
        <span class="grid h-9 w-9 place-items-center rounded-xl bg-brand text-on-brand shadow-sm transition-transform group-hover:-rotate-6">
          <svg aria-hidden="true" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
        </span>
        <span>
          <span class="block font-display text-[15px] font-bold leading-tight sm:text-base">AML TurboTax</span>
          <span class="block text-xs text-muted">for Tranche 2</span>
        </span>
      </button>
      <span id="ruleset-badge" hidden class="rounded-full border border-line bg-surface px-3 py-1 font-mono text-[11px] text-muted"></span>
    </div>
    <div class="h-1 w-full bg-line/50" role="progressbar" id="progress" aria-label="Assessment progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="progress-bar" class="h-full rounded-r-full bg-brand transition-[width] duration-500 ease-out" style="width:0%"></div>
    </div>
  </header>

  <main id="main" class="mx-auto max-w-6xl px-4 py-6 sm:px-6 sm:py-10 lg:px-8">
    <div id="alert" role="alert" hidden class="mb-6 rounded-xl border border-crit/30 bg-crit-soft p-4 text-sm text-crit"></div>
    <div id="view"></div>
    <p id="loading" class="py-24 text-center text-sm text-muted">Loading questionnaire…</p>
  </main>

  <footer class="border-t border-line/70">
    <p id="disclaimer" class="mx-auto max-w-6xl px-4 py-6 text-xs leading-relaxed text-muted sm:px-6 lg:px-8"></p>
  </footer>

  <div class="pointer-events-none fixed inset-x-0 bottom-0 z-40 flex justify-center px-4 pb-[max(1.25rem,env(safe-area-inset-bottom))]">
    <p id="toast" role="status" aria-live="polite" class="translate-y-4 rounded-full bg-ink px-5 py-2.5 text-sm font-medium text-bg opacity-0 shadow-xl transition-all duration-300"></p>
  </div>

  <script>
  "use strict";
  (() => {
    const API_BASE = (() => {
      const configured = document.querySelector('meta[name="aml-api-base"]').content.trim().replace(/\/$/, "");
      if (configured) return configured;
      return ["localhost", "127.0.0.1"].includes(location.hostname) && location.port !== "8787" ? "http://localhost:8787" : "";
    })();

    const SEVERITY = {
      critical: { label: "Critical", pill: "bg-crit-soft text-crit", dot: "bg-crit" },
      high: { label: "High", pill: "bg-high-soft text-high", dot: "bg-high" },
      medium: { label: "Medium", pill: "bg-med-soft text-med", dot: "bg-med" },
      low: { label: "Low", pill: "bg-surface-2 text-muted", dot: "bg-muted" },
    };
    const TIERS = {
      CRITICAL: { label: "Not ready", token: "crit", pill: "bg-crit-soft text-crit" },
      HIGH: { label: "Significant gaps", token: "high", pill: "bg-high-soft text-high" },
      MODERATE: { label: "Action required", token: "med", pill: "bg-med-soft text-med" },
      LOW: { label: "On track", token: "ok", pill: "bg-ok-soft text-ok" },
      SCOPE_UNCONFIRMED: { label: "Confirm designated services", token: "muted", pill: "bg-surface-2 text-ink" },
    };
    const SECTOR_ICONS = {
      real_estate: ["M3 10.5 12 3l9 7.5", "M5 9v11a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9"],
      legal_tcsp: ["M12 3v18", "M7 21h10", "M5 7h14", "M5 7l-3 7a3 3 0 0 0 6 0z", "M19 7l-3 7a3 3 0 0 0 6 0z"],
      accounting: ["M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z", "M8.5 6h7v4h-7z", "M9 14h.01M12 14h.01M15 14h.01M9 18h.01M12 18h.01M15 18h.01"],
    };
    const fmt = new Intl.NumberFormat("en-AU");
    /** The UI shows a "Skipped" tag, so drop the engine's text prefix for unanswered items. */
    const cleanFinding = (text) => text.replace(/^Not answered — scored as [^:]+: /, "");

    const freshMeta = () => ({ organizationName: "", location: "", assessmentTarget: "AUSTRAC Tranche 2 Readiness Review" });
    const state = { questionnaire: null, sectorId: "", meta: freshMeta(), answers: {}, view: "start", qIndex: 0, result: null, gapFilter: "all", advancing: false, startErrors: {} };
    const $ = (id) => document.getElementById(id);

    // ---- DOM helpers: text is always set via textContent, never innerHTML ----
    function h(tag, attrs = {}, ...children) {
      const el = document.createElement(tag);
      applyAttrs(el, attrs);
      appendChildren(el, children);
      return el;
    }
    function s(tag, attrs = {}, ...children) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      applyAttrs(el, attrs);
      appendChildren(el, children);
      return el;
    }
    function applyAttrs(el, attrs) {
      for (const [key, value] of Object.entries(attrs)) {
        if (value === undefined || value === null || value === false) continue;
        if (key === "class") el.setAttribute("class", value);
        else if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
        else el.setAttribute(key, value === true ? "" : String(value));
      }
    }
    function appendChildren(el, children) {
      for (const child of children.flat()) {
        if (child === null || child === undefined || child === false) continue;
        el.append(child instanceof Node ? child : document.createTextNode(String(child)));
      }
    }
    const icon = (paths, cls = "h-5 w-5") =>
      s("svg", { viewBox: "0 0 24 24", class: cls, fill: "none", stroke: "currentColor", "stroke-width": "1.8", "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" }, ...paths.map((d) => s("path", { d })));
    const ICON = {
      check: ["m5 12.5 4.5 4.5L19 7.5"], cross: ["M6 6l12 12M18 6 6 18"], arrowRight: ["M5 12h14", "m13 6 6 6-6 6"], arrowLeft: ["M19 12H5", "m11 6-6 6 6 6"],
      copy: ["M9 9h11v11H9z", "M5 15H4V4h11v1"], download: ["M12 3v12", "m7 10 5 5 5-5", "M4 21h16"], gauge: ["M4 15a8 8 0 1 1 16 0", "m12 15 4-5"],
      list: ["M9 6h11M9 12h11M9 18h11", "M4 6h.01M4 12h.01M4 18h.01"], table: ["M3 5h18v14H3z", "M3 10h18M9 10v9"], info: ["M12 8h.01", "M11 12h1v5h1", "M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"],
      alert: ["M12 9v4M12 17h.01", "M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"],
    };

    const btnPrimary = "inline-flex items-center justify-center gap-2 rounded-xl bg-brand px-5 py-3 text-sm font-semibold text-on-brand shadow-sm transition-all hover:brightness-110 active:scale-[.98] focus:outline-none focus-visible:ring-2 focus-visible:ring-brand focus-visible:ring-offset-2 focus-visible:ring-offset-bg disabled:cursor-wait disabled:opacity-60";
    const btnGhost = "inline-flex items-center justify-center gap-2 rounded-xl border border-line bg-surface px-4 py-2.5 text-sm font-semibold text-ink transition-colors hover:bg-surface-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand disabled:cursor-not-allowed disabled:opacity-40";
    const card = "rounded-3xl border border-line bg-surface shadow-[0_1px_2px_rgb(0_0_0/.04),0_8px_24px_-12px_rgb(0_0_0/.12)]";
    const inputCls = "mt-1.5 w-full rounded-xl border border-line bg-surface px-3.5 py-2.5 text-[15px] text-ink placeholder:text-muted/70 transition-shadow focus:border-brand focus:outline-none focus:ring-4 focus:ring-brand/15";

    function showAlert(message) {
      $("alert").textContent = message;
      $("alert").hidden = !message;
    }
    let toastTimer;
    function toast(message) {
      const el = $("toast");
      el.textContent = message;
      el.classList.remove("opacity-0", "translate-y-4");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add("opacity-0", "translate-y-4"), 2600);
    }

    // ---- Questionnaire model ----
    const sector = () => state.questionnaire.sectors.find((x) => x.id === state.sectorId);
    const pillarOf = (id) => state.questionnaire.pillars.find((p) => p.id === id);
    const answerOf = (id) => state.answers[id];
    const isVisible = (q) => !q.showIf || q.showIf.anyOf.some((c) => answerOf(c.questionId) === c.equals);
    function orderedQuestions() {
      if (!sector()) return [];
      return state.questionnaire.pillars.flatMap((p) => sector().questions.filter((q) => q.pillar === p.id));
    }
    const visibleQuestions = () => orderedQuestions().filter(isVisible);
    function sections() {
      const vis = visibleQuestions();
      return state.questionnaire.pillars
        .map((pillar) => ({ pillar, questions: vis.filter((q) => q.pillar === pillar.id) }))
        .filter((sec) => sec.questions.length > 0);
    }
    const answeredCount = (qs) => qs.filter((q) => answerOf(q.id) !== undefined).length;

    // ---- Navigation ----
    function go(view, qIndex = state.qIndex) {
      state.view = view;
      state.qIndex = qIndex;
      render(true);
    }
    function jumpTo(questionId) {
      const idx = visibleQuestions().findIndex((q) => q.id === questionId);
      go("question", Math.max(0, idx));
    }
    function advanceFrom(questionId) {
      const vis = visibleQuestions();
      const next = vis.findIndex((q) => q.id === questionId) + 1;
      if (next >= vis.length) go("review");
      else go("question", next);
    }
    function back() {
      if (state.view === "review") go("question", visibleQuestions().length - 1);
      else if (state.view === "question" && state.qIndex > 0) go("question", state.qIndex - 1);
      else go("start");
    }
    function answer(q, value) {
      if (state.advancing) return;
      state.answers[q.id] = value;
      state.advancing = true;
      render(false);
      setTimeout(() => { state.advancing = false; advanceFrom(q.id); }, 240);
    }

    // ---- Views ----
    function render(animate) {
      const view = $("view");
      const builders = { start: viewStart, question: viewQuestion, review: viewReview, results: viewResults };
      view.replaceChildren(builders[state.view]());
      if (animate) {
        view.classList.remove("view-enter");
        void view.offsetWidth;
        view.classList.add("view-enter");
        const heading = view.querySelector("[data-autofocus]");
        if (heading) heading.focus({ preventScroll: true });
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      updateProgress();
    }

    function updateProgress() {
      const total = visibleQuestions().length || 1;
      const pct = state.view === "start" ? 0 : state.view === "question" ? Math.round((state.qIndex / total) * 100) : 100;
      $("progress-bar").style.width = pct + "%";
      $("progress").setAttribute("aria-valuenow", String(pct));
    }

    function viewStart() {
      const sample = window.AML_SAMPLE_PAYLOAD;
      const errors = state.startErrors;
      const count = visibleQuestions().length;
      const field = (key, label, required, placeholder) => {
        const err = errors[key];
        return h("div", {},
          h("label", { for: `meta-${key}`, class: "text-sm font-medium" }, label, required ? null : h("span", { class: "font-normal text-muted" }, " (optional)")),
          h("input", {
            id: `meta-${key}`, type: "text", maxlength: "160", autocomplete: key === "organizationName" ? "organization" : "address-level2",
            placeholder, value: state.meta[key], class: inputCls, "aria-invalid": err ? "true" : null, "aria-describedby": err ? `meta-${key}-err` : null,
            oninput: (e) => { state.meta[key] = e.target.value; },
          }),
          err ? h("p", { id: `meta-${key}-err`, class: "mt-1 text-xs font-medium text-crit" }, err) : null,
        );
      };
      const sectorTile = (sec) => {
        const selected = state.sectorId === sec.id;
        return h("label", { class: `group relative flex cursor-pointer items-start gap-3 rounded-2xl border p-3.5 transition-all focus-within:ring-2 focus-within:ring-brand ${selected ? "border-brand bg-brand-soft" : "border-line bg-surface hover:border-muted/50 hover:bg-surface-2/60"}` },
          h("input", { type: "radio", name: "businessType", value: sec.id, checked: selected, class: "sr-only", onchange: () => { if (state.sectorId !== sec.id) { state.sectorId = sec.id; state.answers = {}; } state.startErrors = { ...state.startErrors, sector: "" }; render(false); } }),
          h("span", { class: `grid h-10 w-10 shrink-0 place-items-center rounded-xl transition-colors ${selected ? "bg-brand text-on-brand" : "bg-surface-2 text-ink"}` }, icon(SECTOR_ICONS[sec.id])),
          h("span", { class: "min-w-0" },
            h("span", { class: "block text-sm font-semibold leading-snug" }, sec.label),
            h("span", { class: "mt-0.5 block text-xs leading-relaxed text-muted" }, sec.summary),
          ),
          selected ? h("span", { class: "absolute right-3 top-3 text-brand" }, icon(ICON.check, "h-4 w-4")) : null,
        );
      };
      const benefit = (paths, title, text) =>
        h("li", { class: "flex gap-3" },
          h("span", { class: "grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-brand-soft text-brand" }, icon(paths, "h-[18px] w-[18px]")),
          h("span", {}, h("span", { class: "block text-sm font-semibold" }, title), h("span", { class: "block text-sm text-muted" }, text)),
        );

      return h("div", { class: "grid items-start gap-8 lg:grid-cols-[minmax(0,1.05fr)_minmax(0,1fr)] lg:gap-14" },
        h("section", { class: "lg:pt-8" },
          h("p", { class: "text-xs font-semibold uppercase tracking-[.14em] text-brand" }, "AUSTRAC · AML/CTF Amendment Act 2024"),
          h("h1", { tabindex: "-1", "data-autofocus": true, class: "mt-3 font-display text-4xl font-bold leading-[1.05] tracking-tight focus:outline-none sm:text-5xl lg:text-[3.5rem]" }, "Know where you stand under Tranche 2."),
          h("p", { class: "mt-4 max-w-[34rem] text-base leading-relaxed text-muted sm:text-lg" },
            "Answer plain yes/no questions about how your firm works. You get a risk score, a gap register that cites the AML/CTF Act and Rules, and a data pack ready to paste."),
          h("ul", { class: "mt-8 grid gap-5 sm:grid-cols-3 lg:grid-cols-1 lg:gap-4" },
            benefit(ICON.gauge, "Risk score out of 100", "Weighted across five obligation pillars."),
            benefit(ICON.list, "Prioritised gap register", "Each gap tied to its legal reference."),
            benefit(ICON.table, "One-click data pack", "Tab-delimited rows for your records."),
          ),
        ),
        h("form", { class: `${card} p-5 sm:p-7`, novalidate: true, onsubmit: (e) => { e.preventDefault(); startAssessment(); } },
          h("div", { class: "flex items-baseline justify-between gap-3" },
            h("h2", { class: "font-display text-xl font-bold" }, "Your business"),
            count ? h("span", { class: "tabular text-xs text-muted" }, `${count} questions · about ${Math.max(5, Math.round(count / 3))} min`) : null,
          ),
          sample ? h("button", { type: "button", class: "mt-4 flex w-full items-center justify-between gap-3 rounded-xl border border-dashed border-brand/50 bg-brand-soft/60 px-4 py-3 text-left text-sm transition-colors hover:bg-brand-soft", onclick: () => loadSample(sample) },
            h("span", {}, h("span", { class: "block font-semibold text-brand" }, "Try the example"), h("span", { class: "block text-xs text-muted" }, `${sample.meta.organizationName} · sample answers`)),
            h("span", { class: "text-brand" }, icon(ICON.arrowRight, "h-4 w-4")),
          ) : null,
          h("div", { class: "mt-5 grid gap-4 sm:grid-cols-2" },
            field("organizationName", "Business name", true, "e.g. Harbourside Realty"),
            field("location", "Suburb and state", false, "e.g. Fitzroy, VIC"),
          ),
          h("fieldset", { class: "mt-6", "aria-describedby": errors.sector ? "sector-err" : null },
            h("legend", { class: "text-sm font-medium" }, "What does your business do?"),
            h("div", { class: "mt-2 grid gap-2.5" }, state.questionnaire.sectors.map(sectorTile)),
            errors.sector ? h("p", { id: "sector-err", class: "mt-2 text-xs font-medium text-crit" }, errors.sector) : null,
          ),
          h("button", { type: "submit", class: `${btnPrimary} mt-6 w-full py-3.5 text-[15px]` }, "Start assessment", icon(ICON.arrowRight, "h-4 w-4")),
          h("p", { class: "mt-3 text-center text-xs text-muted" }, "Your answers are not saved. Skip anything you're unsure of and come back to it."),
        ),
      );
    }

    function startAssessment() {
      const errors = {};
      if (!state.meta.organizationName.trim()) errors.organizationName = "Enter your business name.";
      if (!state.sectorId) errors.sector = "Choose the option closest to your business.";
      state.startErrors = errors;
      if (Object.keys(errors).length) {
        render(false);
        const first = errors.organizationName ? $("meta-organizationName") : document.querySelector('input[name="businessType"]');
        if (first) first.focus();
        return;
      }
      go("question", 0);
    }

    function loadSample(sample) {
      state.meta = { ...freshMeta(), ...sample.meta };
      state.sectorId = sample.businessType;
      state.answers = Object.assign({}, sample.complianceInputs, sample.industrySpecifics, sample.operationalMetrics);
      state.startErrors = {};
      render(false);
      toast("Example loaded. Press Start to walk through it.");
    }

    function rail(activePillarId) {
      const secs = sections();
      const item = (sec) => {
        const done = answeredCount(sec.questions);
        const complete = done === sec.questions.length;
        const active = sec.pillar.id === activePillarId;
        return h("li", {},
          h("button", { type: "button", "aria-current": active ? "step" : null, onclick: () => jumpTo(sec.questions[0].id),
            class: `flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-sm transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-brand ${active ? "bg-surface font-semibold shadow-sm ring-1 ring-line" : "text-muted hover:bg-surface/70 hover:text-ink"}` },
            h("span", { class: `grid h-6 w-6 shrink-0 place-items-center rounded-full text-[11px] ${complete ? "bg-brand text-on-brand" : active ? "border-2 border-brand text-brand" : "border border-line"}` },

    function viewQuestion() {

      const value = answerOf(q.id);
      const sev = SEVERITY[q.severity];

      const kindCls = q.polarity === "control" ? sev.pill : "bg-surface-2 text-muted";

      const choice = (val, label, sub, key) => {
        const selected = value === val;
        return h("button", { type: "button", "aria-pressed": String(selected), onclick: () => answer(q, val),

        control = h("div", { class: "mt-7" },

            h("button", { type: "button", class: btnPrimary, onclick: () => advanceFrom(q.id) }, "Continue", icon(ICON.arrowRight, "h-4 w-4")),
          ),
          preview,

            h("p", { id: "q-help", class: "mt-3 max-w-[60ch] text-[15px] leading-relaxed text-muted" }, q.help),
            control,
            h("div", { class: "mt-8 flex items-center justify-between gap-3 border-t border-line pt-5" },

                h("button", { type: "button", class: "text-sm font-semibold text-brand underline-offset-4 hover:underline focus:outline-none focus-visible:ring-2 focus-visible:ring-brand rounded", onclick: () => advanceFrom(q.id) }, value === undefined ? "Skip for now" : "Next"),

            h("p", { class: "mt-3 text-xs leading-relaxed text-muted" }, pillar.penaltyScope),

    function viewReview() {
      const secs = sections();

      const answered = answeredCount(vis);
      const skipped = vis.length - answered;
      const firstSkipped = vis.find((q) => answerOf(q.id) === undefined);
      return h("div", { class: "grid gap-6 lg:grid-cols-[250px_minmax(0,1fr)] lg:gap-10" },

          h("h2", { id: "review-title", tabindex: "-1", "data-autofocus": true, class: "mt-3 font-display text-3xl font-bold tracking-tight focus:outline-none" }, "Ready for your report"),
          h("p", { class: "tabular mt-2 text-muted" }, `You answered ${answered} of ${vis.length} questions for ${state.meta.organizationName}.`),

                h("button", { type: "button", class: "rounded-lg px-2.5 py-1 text-xs font-semibold text-brand hover:bg-brand-soft", onclick: () => jumpTo(sec.questions[0].id), "aria-label": `Edit ${sec.pillar.title}` }, "Edit"),

          ),
        ),

    }

    function buildPayload() {
      const payload = { meta: { ...state.meta }, businessType: state.sectorId, complianceInputs: {}, industrySpecifics: {}, operationalMetrics: {} };
      for (const q of visibleQuestions()) {
        if (answerOf(q.id) !== undefined) payload[q.group][q.id] = answerOf(q.id);
      }
      return payload;
    }

    async function submitAssessment() {
      const btn = $("generate-btn");
      btn.disabled = true;
      btn.firstChild.textContent = "Generating…";
      try {
        const res = await fetch(`${API_BASE}/v1/assess`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(buildPayload()) });
        const body = await res.json();
        if (!res.ok) throw new Error([body.error, ...(body.details || [])].join(" "));
        state.result = body;
        state.gapFilter = "all";
        showAlert("");
        go("results");
      } catch (err) {
        showAlert(`We couldn't generate the report: ${err.message} Check your connection and try again.`);
        btn.disabled = false;
        btn.firstChild.textContent = "Generate my report";
      }
    }

    function gauge(score, token) {
      const arc = "M 20 110 A 90 90 0 0 1 200 110";
      const fg = s("path", { d: arc, fill: "none", stroke: `rgb(var(--${token}))`, "stroke-width": "16", "stroke-linecap": "round", pathLength: "100", "stroke-dasharray": "0 100", class: "gauge-arc" });
      requestAnimationFrame(() => requestAnimationFrame(() => fg.setAttribute("stroke-dasharray", `${Math.max(score, 0.5)} 100`)));
      return h("div", { class: "relative mx-auto w-full max-w-[260px]" },
        s("svg", { viewBox: "0 0 220 124", class: "w-full", role: "img", "aria-label": `Risk score ${score} out of 100` },
          s("path", { d: arc, fill: "none", stroke: "rgb(var(--surface-2))", "stroke-width": "16", "stroke-linecap": "round" }),
          fg,
          s("text", { x: "20", y: "122", "text-anchor": "middle", "font-size": "10", fill: "rgb(var(--muted))" }, "0"),
          s("text", { x: "200", y: "122", "text-anchor": "middle", "font-size": "10", fill: "rgb(var(--muted))" }, "100"),
        ),
        h("div", { class: "absolute inset-x-0 bottom-1 text-center" },
          h("p", { class: "tabular font-display text-5xl font-bold leading-none" }, String(score)),
          h("p", { class: "mt-1 text-xs text-muted" }, "risk score"),
        ),
      );
    }

                  h("div", { class: "flex items-baseline justify-between gap-3 text-sm" }, h("span", { class: "font-medium" }, p.title), h("span", { class: "tabular text-xs text-muted" }, `${p.score} · ${p.gapCount} gap${p.gapCount === 1 ? "" : "s"}`)),
                  h("div", { class: "mt-1.5 h-2 overflow-hidden rounded-full bg-surface-2" }, h("div", { class: "h-full rounded-full transition-all duration-700", style: `width:${Math.max(p.score, 2)}%;background:rgb(var(--${tone}))` })),
                  h("details", { class: "mt-1 text-xs text-muted" }, h("summary", { class: "cursor-pointer hover:text-ink" }, "Penalty scope"), h("p", { class: "mt-1 leading-relaxed" }, p.penaltyScope)),
                );
              })),
            ),
            h("section", { class: `${card} p-5 sm:p-7`, "aria-labelledby": "risks-title" },
              h("h2", { id: "risks-title", class: "font-display text-xl font-bold" }, "Inherent risk factors"),
              h("ul", { class: "mt-4 space-y-2.5 text-sm" }, (results.riskFactors.length ? results.riskFactors : ["No inherent risk factors flagged."]).map((r) =>
                h("li", { class: "flex gap-2.5" }, h("span", { class: "mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full bg-high" }), h("span", { class: "text-muted" }, cleanFinding(r))))),
            ),
          ),
        ),

        h("div", { class: "flex flex-col gap-3 sm:flex-row" },
          h("button", { type: "button", class: btnGhost, onclick: () => go("review") }, icon(ICON.arrowLeft, "h-4 w-4"), "Edit answers"),
          h("button", { type: "button", class: btnGhost, onclick: resetAll }, "Start a new assessment"),
        ),
      );
    }

    async function copyPayload() {
      const area = $("payload");
      const text = area.value;
      const rows = text.split("\n").length - 1;
      try {
        if (!navigator.clipboard) throw new Error("Clipboard API unavailable");
        await navigator.clipboard.writeText(text);
      } catch {
        area.focus();
        area.select();
        let copied = false;
        try { copied = document.execCommand("copy"); } catch { copied = false; }
        if (!copied) { toast("Text selected. Press Ctrl+C or Cmd+C to copy."); return; }
      }
      toast(`Copied ${rows} rows to your clipboard`);
      $("copy-label").textContent = "Copied";
      setTimeout(() => { const label = $("copy-label"); if (label) label.textContent = "Copy Data Pack for AUSTRAC"; }, 2500);
    }

    function downloadPayload() {
      const { entity, meta } = state.result;
      const blob = new Blob([$("payload").value], { type: "text/tab-separated-values;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const slug = entity.organizationName.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "entity";
      h("a", { href: url, download: `austrac-data-pack-${slug}-${meta.assessedAt.slice(0, 10)}.tsv` }).click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function resetAll() {
      Object.assign(state, { sectorId: "", meta: freshMeta(), answers: {}, qIndex: 0, result: null, startErrors: {} });
      go("start");
    }

    document.addEventListener("keydown", (e) => {
      if (state.view !== "question" || e.metaKey || e.ctrlKey || e.altKey) return;
      const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName);
      const q = visibleQuestions()[state.qIndex];
      if (!q) return;
      if (!typing && q.input === "boolean" && (e.key === "y" || e.key === "Y")) { e.preventDefault(); answer(q, true); }
      else if (!typing && q.input === "boolean" && (e.key === "n" || e.key === "N")) { e.preventDefault(); answer(q, false); }
      else if (!typing && e.key === "ArrowLeft") { e.preventDefault(); back(); }
    });
    $("home-btn").addEventListener("click", () => { if (state.questionnaire && state.view !== "start") go("start"); });

    (async () => {
      try {
        const res = await fetch(`${API_BASE}/v1/questionnaire`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        state.questionnaire = await res.json();
        $("disclaimer").textContent = state.questionnaire.disclaimer;
        $("ruleset-badge").textContent = `Ruleset ${state.questionnaire.rulesetVersion}`;
        $("ruleset-badge").hidden = false;
        $("loading").hidden = true;
        render(false);
      } catch (err) {
        $("loading").hidden = true;
        showAlert(`We couldn't reach the assessment service at ${API_BASE || location.origin} (${err.message}). Set the aml-api-base meta tag to your Worker URL.`);
      }
    })();
  })();
  </script>
</body>
</html>
